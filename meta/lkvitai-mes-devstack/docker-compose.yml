services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: devpwd }
    ports: ["5432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: [ "mosq:/mosquitto" ]

  seq:
    image: datalust/seq:2024
    environment: { ACCEPT_EULA: Y }
    ports: ["5341:80"]

volumes: { pgdata: {}, mosq: {} }
